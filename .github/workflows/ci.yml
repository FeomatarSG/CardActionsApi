name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CardActions.Api.Tests

      - name: Build
        run: dotnet build CardActions.Api.Tests --no-restore --configuration Release

      - name: Test
        run: dotnet test CardActions.Api.Tests --no-build --configuration Release
